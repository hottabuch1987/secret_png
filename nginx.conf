server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    # Встроенный DNS Docker — резолвинг имён контейнеров во время запроса
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Базовые заголовки безопасности
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Ограничение методов HTTP
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Запрет доступа к чувствительным файлам
    location ~* \.(env|git|svn|htaccess|htpasswd|ini|log|sh|bak|save|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Статические файлы Django (отдаём напрямую)
    location /static/ {
        alias /usr/src/app/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Медиа файлы Django
    location /media/ {
        alias /usr/src/app/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # WebSocket соединения (на бэкенд)
    location /ws/ {
        set $backend_ws http://app:8000;
        proxy_pass $backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # API и админка Django (на бэкенд)
    location ~ ^/(api|admin|auth|swagger|redoc)/ {
        set $backend_api http://app:8000;
        proxy_pass $backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60;
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
    }

    # Все остальные запросы идут на фронтенд (Nuxt 3)
    location / {
        set $frontend http://front:3000;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60;
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
    }

    # Flower (доступен по http://domain/flower/)
    location /flower/ {
        set $flower_upstream http://flower:5555;
        proxy_pass $flower_upstream/;        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Redis Commander (доступен по http://domain/redis-commander/)
    location /redis-commander/ {
        set $redis_commander http://redis-commander:8081;
        proxy_pass $redis_commander/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}